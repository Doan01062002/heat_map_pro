# ==============================================================================
# Air — Hot-reload configuration for Go development
# ==============================================================================
# Usage: cd backend && air
# Docs:  https://github.com/air-verse/air
# ==============================================================================

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "gen", "bin"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "toml"]
  kill_delay = "0s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
