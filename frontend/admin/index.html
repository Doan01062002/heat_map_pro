<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admin Dashboard — Real-Time Driver Deviation Heatmap Visualization" />
    <title>Heatmap Dashboard | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      /* Custom Ultra-Thin Sleek Scrollbar */
      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: rgba(108, 99, 255, 0.35) transparent;
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a0a1a;
      }
      .maplibregl-popup-content,
      .maplibregl-popup-content *,
      .custom-thin-scroll {
        scrollbar-width: thin;
        scrollbar-color: rgba(100, 110, 140, 0.3) transparent;
      }
      ::-webkit-scrollbar,
      .maplibregl-popup-content::-webkit-scrollbar,
      .maplibregl-popup-content *::-webkit-scrollbar,
      .custom-thin-scroll::-webkit-scrollbar {
        width: 3px !important;
        height: 3px !important;
      }
      ::-webkit-scrollbar-track,
      .maplibregl-popup-content::-webkit-scrollbar-track,
      .maplibregl-popup-content *::-webkit-scrollbar-track,
      .custom-thin-scroll::-webkit-scrollbar-track {
        background: transparent !important;
      }
      ::-webkit-scrollbar-thumb,
      .maplibregl-popup-content::-webkit-scrollbar-thumb,
      .maplibregl-popup-content *::-webkit-scrollbar-thumb,
      .custom-thin-scroll::-webkit-scrollbar-thumb {
        background: rgba(100, 110, 140, 0.35) !important;
        border-radius: 10px !important;
      }
      ::-webkit-scrollbar-thumb:hover,
      .maplibregl-popup-content::-webkit-scrollbar-thumb:hover,
      .maplibregl-popup-content *::-webkit-scrollbar-thumb:hover,
      .custom-thin-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(108, 99, 255, 0.8) !important;
      }
    </style>
  </head>
  <body>
    <div id="root" style="height: 100%; width: 100%; overflow: hidden;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
