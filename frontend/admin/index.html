<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admin Dashboard — Real-Time Driver Deviation Heatmap Visualization" />
    <title>Heatmap Dashboard | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: rgba(108, 99, 255, 0.35) rgba(15, 12, 41, 0.6);
      }
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a0a1a;
      }
      /* Custom Sleek Scrollbar */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(15, 12, 41, 0.5);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(108, 99, 255, 0.35);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6c63ff;
      }
    </style>
  </head>
  <body>
    <div id="root" style="height: 100%; width: 100%; overflow: hidden;"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
