# ==============================================================================
# Nginx Reverse Proxy Configuration
# ==============================================================================
# Single entry point on port 80 for all services.
# Routes:
#   /api/*       → Go Backend (HTTP)
#   /ws/*        → Go Backend (WebSocket upgrade)
#   /simulator/* → Simulator SPA (static files)
#   /admin/*     → Admin Dashboard SPA (static files)
#   /            → Redirect to /admin
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # ---- Upstream: Go Backend ----
    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # ---- API Routes (HTTP) ----
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ---- WebSocket Routes ----
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket timeout — keep connections alive for long sessions
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- Simulator SPA ----
        location /simulator {
            alias /usr/share/nginx/simulator;
            try_files $uri $uri/ /simulator/index.html;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # ---- Admin Dashboard SPA ----
        location /admin {
            alias /usr/share/nginx/admin;
            try_files $uri $uri/ /admin/index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # ---- Root redirect ----
        location = / {
            return 302 /admin;
        }

        # ---- Health check for Nginx itself ----
        location /nginx-health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
